<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login - Velocity Bikes</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body class="login-body">


<div class="login-wrapper">


    <!-- LEFT SIDE -->

    <div class="login-brand">

        <div>

            <p class="login-label">
                VELOCITY BIKES
            </p>

            <h1>
                Welcome<br>
                Back.
            </h1>

            <p class="login-description">
                Manage your motorcycle showroom,
                inventory and customer test rides
                from one place.
            </p>

        </div>


        <p class="login-footer-text">
            © 2026 Velocity Bikes
        </p>

    </div>



    <!-- RIGHT SIDE -->

    <div class="login-panel">


        <div class="login-box">


            <div class="login-logo">
                🏍️
            </div>


            <p class="login-small">
                ADMIN PORTAL
            </p>


            <h2>
                Sign in
            </h2>


            <p class="login-subtitle">
                Enter your credentials to continue.
            </p>



            <form id="loginForm">


                <label>
                    Username
                </label>


                <input
                    type="text"
                    id="username"
                    placeholder="Enter username"
                    required
                >



                <label>
                    Password
                </label>


                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required
                >



                <button
                    type="submit"
                    class="login-button"
                >
                    Sign In
                </button>


            </form>


            <p
                id="loginMessage"
                class="login-message"
            ></p>


            <a
                href="index.html"
                class="back-home"
            >
                ← Back to showroom
            </a>


        </div>


    </div>

</div>



<script>

document
    .getElementById("loginForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const username =
                document.getElementById(
                    "username"
                ).value;


            const password =
                document.getElementById(
                    "password"
                ).value;


            const message =
                document.getElementById(
                    "loginMessage"
                );


            try {

                const response =
                    await fetch(
                        "http://127.0.0.1:5000/login",
                        {

                            method: "POST",

                            credentials:
                                "include",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({
                                    username:
                                        username,

                                    password:
                                        password
                                })

                        }
                    );


                const result =
                    await response.json();


                if (response.ok) {

                    message.textContent =
                        "Login successful.";

                    message.className =
                        "login-message success";


                    setTimeout(
                        function() {

                            window.location.href =
                                "admin.html";

                        },
                        500
                    );

                }

                else {

                    message.textContent =
                        result.error ||
                        "Invalid username or password.";

                    message.className =
                        "login-message error";

                }

            }

            catch(error) {

                console.error(error);

                message.textContent =
                    "Cannot connect to server.";

                message.className =
                    "login-message error";

            }

        }
    );

</script>


</body>

</html>
